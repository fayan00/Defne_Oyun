name: Deploy Balloon Game to GitHub Pages

on:
  push:
    branches: ["main", "cursor/balloon-pop-game-ac89"]
    paths:
      - "balloon-pop-game/**"
      - ".github/workflows/deploy-balloon-game-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static files
        run: |
          mkdir -p _site
          cp -r balloon-pop-game/* _site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
