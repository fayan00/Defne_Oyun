<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .track-gradient {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
        }
        .speedometer-glow {
            filter: drop-shadow(0 0 8px rgba(253, 215, 59, 0.6));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body-md text-on-background overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-20 bg-sky-400 dark:bg-sky-600 rounded-b-[32px] border-b-4 border-sky-500 dark:border-sky-700 shadow-[0_6px_0_0_rgba(0,0,0,0.1)]">
<div class="flex items-center gap-3">
<div class="w-12 h-12 bg-white rounded-full border-2 border-sky-200 flex items-center justify-center overflow-hidden">
<img alt="Avatar" class="w-full h-full object-cover" data-alt="A friendly cartoon learning buddy character with a bright smile and explorer gear, stylized for a 7-year-old audience" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqFY-LmevQEiern2nvJ1efnoUonusiZIl-nmfq8P_8W2IVtvnJwjl5tVY_VU7nurByyu63-jhYZIr4VLp88Z-y90YiZTBFcLYAN1YELB6RRmkYy3Mv9DfJcd-72HxaA5AHg0XE6qDwB1ABqq3IcLQ8yDgcw_1XywDCO-dLPr71BdkpVGOT0nYcszXcDnyD24CtKsqmJjEQ5RP8GL0pOlZK58wFlWGraHIeLwrPgFAApPt9BwUruCaT-LhjIb1aVpI5vA_K9BiT9g0S"/>
</div>
<h1 class="font-['Lexend'] font-bold text-lg text-white">Kâşif Defne</h1>
</div>
<div class="text-2xl font-black text-white drop-shadow-[0_2px_0_rgba(0,0,0,0.2)]">Matematik Yarışı</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white text-3xl" data-icon="stars" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
</header>
<!-- Main Game Canvas -->
<main class="relative h-screen pt-20 pb-24 overflow-hidden bg-sky-100">
<!-- Background Scenery (Parallax effect style) -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-sky-300 to-sky-100"></div>
<!-- Decorative Hills -->
<div class="absolute bottom-1/2 left-0 w-full h-32 flex items-end">
<div class="w-1/3 h-16 bg-tertiary opacity-20 rounded-t-full translate-y-4"></div>
<div class="w-1/2 h-24 bg-tertiary opacity-30 rounded-t-full -translate-x-12 translate-y-4"></div>
<div class="w-1/4 h-20 bg-tertiary opacity-20 rounded-t-full translate-y-4"></div>
</div>
</div>
<!-- The Racing Track -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[120%] h-[60%] track-gradient origin-bottom rotate-x-45 perspective-1000 shadow-2xl rounded-t-[100px] border-t-8 border-slate-600">
<!-- Road Markings -->
<div class="absolute left-1/2 top-0 bottom-0 w-4 border-l-4 border-r-4 border-dashed border-white/30 -translate-x-1/2"></div>
<!-- Rivals (Placeholders) -->
<div class="absolute left-1/4 top-1/4 w-32 h-20 bg-error rounded-xl shadow-[0_8px_0_0_#991b1b] flex items-center justify-center transform -skew-x-12">
<span class="material-symbols-outlined text-white text-4xl" data-icon="directions_car">directions_car</span>
</div>
<div class="absolute right-1/4 top-1/3 w-32 h-20 bg-on-tertiary-container rounded-xl shadow-[0_8px_0_0_#002112] flex items-center justify-center transform skew-x-12">
<span class="material-symbols-outlined text-white text-4xl" data-icon="directions_car">directions_car</span>
</div>
<!-- Player Car (Defne) -->
<div class="absolute left-1/2 bottom-12 -translate-x-1/2 w-48 h-32 bg-secondary-container rounded-2xl shadow-[0_12px_0_0_#ca8a04] border-4 border-white flex flex-col items-center justify-center transform hover:scale-105 transition-transform duration-300">
<div class="absolute -top-12 left-1/2 -translate-x-1/2 bg-white px-4 py-1 rounded-full shadow-md text-slate-900 font-bold border-2 border-secondary">Defne</div>
<span class="material-symbols-outlined text-on-secondary-container text-7xl" data-icon="race_car" style="font-variation-settings: 'FILL' 1;">electric_car</span>
<!-- Speed Lines -->
<div class="absolute -left-12 top-1/2 w-8 h-1 bg-white/40 rounded-full"></div>
<div class="absolute -right-12 top-1/3 w-10 h-1 bg-white/40 rounded-full"></div>
</div>
</div>
<!-- HUD: Heads Up Display -->
<div class="absolute top-24 left-6 right-6 flex justify-between items-start z-10">
<!-- Position Indicator -->
<div class="bg-white/90 backdrop-blur-md px-6 py-4 rounded-lg border-b-4 border-slate-200 shadow-lg flex flex-col items-center">
<span class="text-slate-500 font-label-bold">SIRALAMA</span>
<span class="text-headline-lg font-headline-lg text-primary">2 / 8</span>
</div>
<!-- Speedometer -->
<div class="relative w-40 h-40 bg-slate-900 rounded-full border-8 border-slate-800 shadow-2xl flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 opacity-20">
<img alt="Dashboard" class="w-full h-full object-cover" data-alt="Close-up of a vibrant neon digital speedometer dashboard with glowing arcs and digital numbers" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUYPqxUpFMamJPPBLNHYtynWa9KKMfvnTKwt7nMkVdXzybDSux-wtFncxENkxLMNjfQsXd5s0M8WdX31hwtAD5Yy8JVu0XWakH61qnaXrKi_bIqGiXXMeDB3betoMc1ZxrX_CE2Wllzbgi8Cq1T_hVdQoHbxiD_2LL3uvQ7fjRE7kyZ8Gg_gpk0qttTwTiCrmcBzeCcqApFBEyztozIDgdM3VV5-dA_YQKfF4i5K2gUW5cO11E4U0RqXevg-cRMpabMuzlKqOiLAkG"/>
</div>
<div class="z-10 flex flex-col items-center">
<span class="text-headline-xl font-headline-xl text-yellow-400 speedometer-glow">85</span>
<span class="text-xs font-bold text-slate-400 tracking-widest">KM/H</span>
</div>
<!-- Speed Needle (Simplified) -->
<div class="absolute bottom-1/2 left-1/2 w-1 h-16 bg-error origin-bottom -rotate-45 rounded-full"></div>
</div>
<!-- Progress Bar -->
<div class="bg-white/90 backdrop-blur-md px-6 py-4 rounded-lg border-b-4 border-slate-200 shadow-lg w-64">
<div class="flex justify-between mb-2">
<span class="text-slate-500 font-label-bold">YARIŞ TAMAMLANDI</span>
<span class="text-primary font-bold">60%</span>
</div>
<div class="w-full h-6 bg-slate-200 rounded-full overflow-hidden border-2 border-slate-100">
<div class="w-[60%] h-full bg-tertiary-container relative">
<span class="absolute right-1 top-1/2 -translate-y-1/2 material-symbols-outlined text-white text-xs" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
</div>
</div>
<!-- Question Area (Bento Grid Style) -->
<div class="absolute inset-x-0 bottom-32 z-20 px-6 flex flex-col items-center">
<!-- Question Card -->
<div class="bg-white p-8 rounded-xl shadow-[0_8px_0_0_#e1e3e4] border-2 border-surface-container-highest mb-6 transform scale-110">
<div class="text-center">
<span class="text-headline-md font-headline-md text-slate-400 block mb-2">HAYDİ DEFNE!</span>
<span class="text-headline-xl font-headline-xl text-on-surface">3 x 4 = <span class="text-primary">?</span></span>
</div>
</div>
<!-- Answer Buttons -->
<div class="grid grid-cols-3 gap-6 w-full max-w-2xl">
<button class="bg-white hover:bg-sky-50 py-6 rounded-lg border-b-8 border-slate-200 active:translate-y-2 active:border-b-0 transition-all duration-150 group">
<span class="text-headline-lg font-headline-lg text-on-surface group-active:text-primary">10</span>
</button>
<button class="bg-secondary-container hover:bg-yellow-300 py-6 rounded-lg border-b-8 border-secondary active:translate-y-2 active:border-b-0 transition-all duration-150 group">
<span class="text-headline-lg font-headline-lg text-on-secondary-container">12</span>
</button>
<button class="bg-white hover:bg-sky-50 py-6 rounded-lg border-b-8 border-slate-200 active:translate-y-2 active:border-b-0 transition-all duration-150 group">
<span class="text-headline-lg font-headline-lg text-on-surface group-active:text-primary">15</span>
</button>
</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-4 h-24 bg-white dark:bg-slate-900 rounded-t-[32px] border-t-4 border-slate-100 dark:border-slate-800 shadow-[0_-8px_20px_rgba(0,0,0,0.05)]">
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 hover:bg-sky-50 dark:hover:bg-slate-800 rounded-2xl transition-all" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="map">map</span>
<span class="font-['Lexend'] font-medium text-[12px]">Harita</span>
</a>
<a class="flex flex-col items-center justify-center bg-yellow-400 text-slate-900 rounded-2xl px-6 py-2 shadow-[0_4px_0_0_#ca8a04] -translate-y-2 active:translate-y-0 active:shadow-none transition-all duration-200" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="menu_book">menu_book</span>

<span class="material-symbols-outlined text-2xl" data-icon="workspace_premium">workspace_premium</span>
<span class="font-['Lexend'] font-medium text-[12px]">Hazine</span>
</a>
</nav>
<!-- Feedback Layer (Invisible by default, would trigger on correct answer) -->
<div class="fixed inset-0 z-40 bg-tertiary-container/20 pointer-events-none opacity-0 flex items-center justify-center">
<div class="bg-white p-12 rounded-full shadow-2xl border-8 border-tertiary transform scale-0 transition-transform duration-500">
<span class="material-symbols-outlined text-tertiary text-9xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</body></html>
