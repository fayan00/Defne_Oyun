<body class="bg-[#e0f7fa] font-body-md text-on-background min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-20 bg-[#4CB9E7] dark:bg-sky-900 rounded-b-[32px] border-b-4 border-sky-600/30 shadow-[0_6px_0_0_#3182ce]">
<div class="flex items-center gap-4">
<button class="bg-white/20 p-2 rounded-full hover:scale-105 transition-transform active:translate-y-1 active:shadow-none">
<span class="material-symbols-outlined text-white text-3xl">arrow_back</span>
</button>
<h1 class="font-lexend font-bold tracking-wide text-white text-2xl drop-shadow-md">Matematik Adası</h1>
</div>
<div class="flex items-center gap-2 bg-yellow-400 px-4 py-1.5 rounded-full border-b-4 border-yellow-600 shadow-sm active:translate-y-1 transition-all">
<span class="text-white font-black text-xl">⭐ 125</span>
</div>
</header>
<!-- Main Map Canvas -->
<main class="pt-32 pb-32 px-container-margin min-h-screen relative overflow-hidden">
<!-- Decorative Background Map Elements -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
<div class="absolute top-40 left-10 w-32 h-32 bg-tertiary-container rounded-full blur-3xl"></div>
<div class="absolute bottom-60 right-10 w-48 h-48 bg-primary-container rounded-full blur-3xl"></div>
</div>
<!-- The Adventure Path (SVG Path Simulation) -->
<div class="relative max-w-lg mx-auto z-10">
<!-- Game Section 1: Ritmik Saymalar -->
<div class="flex flex-col items-center mb-element-gap-lg">
<div class="relative group">
<div class="absolute -top-4 -right-4 bg-white px-3 py-1 rounded-full border-2 border-primary shadow-md z-20 flex gap-1">
<span class="material-symbols-outlined text-yellow-400 text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-yellow-400 text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-slate-300 text-lg">star</span>
</div>
<button class="w-32 h-32 bg-primary-container rounded-xl border-b-8 border-primary flex items-center justify-center shadow-lg hover:scale-105 active:translate-y-2 active:border-b-0 transition-all">
<span class="material-symbols-outlined text-white text-6xl">counter_2</span>
</button>
</div>
<h3 class="font-headline-md text-primary mt-4 bg-white/80 px-4 py-1 rounded-full border-2 border-primary-fixed-dim">Ritmik Saymalar</h3>
</div>
<!-- Path Line -->
<div class="w-2 h-16 bg-dashed border-l-4 border-dashed border-sky-400 mx-auto opacity-50"></div>
<!-- Game Section 2: Toplama & Çıkarma -->
<div class="flex flex-col items-end mr-8 mb-element-gap-lg">
<div class="relative group">
<div class="absolute -top-4 -left-4 bg-white px-3 py-1 rounded-full border-2 border-secondary shadow-md z-20 flex gap-1">
<span class="material-symbols-outlined text-yellow-400 text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-yellow-400 text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-yellow-400 text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<button class="w-32 h-32 bg-secondary-container rounded-xl border-b-8 border-secondary flex items-center justify-center shadow-lg hover:scale-105 active:translate-y-2 active:border-b-0 transition-all">
<span class="material-symbols-outlined text-on-secondary-container text-6xl">add_notes</span>
</button>
</div>
<h3 class="font-headline-md text-secondary mt-4 bg-white/80 px-4 py-1 rounded-full border-2 border-secondary-fixed-dim">Toplama &amp; Çıkarma</h3>
</div>
<!-- Path Line Curve -->
<div class="w-full h-16 relative">
<svg class="absolute inset-0 w-full h-full" preserveaspectratio="none" viewbox="0 0 100 100">
<path d="M 80 0 Q 80 100 20 100" fill="none" opacity="0.4" stroke="#4CB9E7" stroke-dasharray="10 10" stroke-width="4"></path>
</svg>
</div>
<!-- Game Section 3: Paralarımız (Locked State) -->
<div class="flex flex-col items-start ml-8 mb-element-gap-lg">
<div class="relative">
<!-- Overlay for Locked State -->
<div class="absolute inset-0 bg-slate-400/30 backdrop-blur-[1px] rounded-xl z-10 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-700 text-4xl bg-white/80 p-2 rounded-full shadow-lg">lock</span>
</div>
<button class="w-32 h-32 bg-tertiary-container rounded-xl border-b-8 border-tertiary flex items-center justify-center shadow-lg grayscale-[0.5]">
<span class="material-symbols-outlined text-white text-6xl">payments</span>
</button>
</div>
<h3 class="font-headline-md text-tertiary mt-4 bg-white/80 px-4 py-1 rounded-full border-2 border-tertiary-fixed-dim opacity-70">Paralarımız</h3>
</div>
<!-- Path Line -->
<div class="w-2 h-16 bg-dashed border-l-4 border-dashed border-sky-400 mx-auto opacity-50"></div>
<!-- Bonus Section: Eğlenceli Geometri -->
<div class="flex flex-col items-center mb-element-gap-lg">
<div class="relative group">
<button class="w-32 h-32 bg-primary-fixed-dim rounded-xl border-b-8 border-primary flex items-center justify-center shadow-lg hover:scale-105 active:translate-y-2 active:border-b-0 transition-all grayscale">
<span class="material-symbols-outlined text-primary text-6xl">category</span>
</button>
<!-- Locked Badge -->
<div class="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-error text-white text-xs font-black px-4 py-1 rounded-full shadow-lg whitespace-nowrap">
                        150 ⭐ GEREKLİ
                    </div>
</div>
<h3 class="font-headline-md text-primary-fixed mt-8 bg-white/80 px-4 py-1 rounded-full border-2 border-primary-fixed-dim opacity-50">Geometri</h3>
</div>
</div>
<!-- Floating Buddy -->
<div class="fixed bottom-32 right-6 z-40">
<div class="bg-white p-4 rounded-lg shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)] border-2 border-sky-100 flex flex-col items-center gap-2">
<div class="w-16 h-16 bg-yellow-200 rounded-full flex items-center justify-center border-4 border-yellow-400">
<span class="material-symbols-outlined text-yellow-600 text-4xl">emoji_objects</span>
</div>
<p class="font-label-bold text-sky-900 text-center">Hadi<br/>Başlayalım!</p>
</div>
</div>
</main>

<a class="text-slate-400 dark:text-slate-500 flex flex-col items-center gap-1 hover:text-sky-500 transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">map</span>
<span class="font-lexend font-extrabold text-xs uppercase">Map</span>
